  --bg:#0A1020; --sf:#121B30; --sf2:#1B2644; --fg:#EAF0FF; --mu:#8FA0C4; --ln:#223052;
  --a:#3D86FF; --b:#FF5252; --ac:#FFD23F; --ac-ink:#0A1020; --ac-txt:#FFD23F; --ok:#6EE7A5; --warn:#FF8A5B;
  --a-txt:#8DB7FF; --b-txt:#FF9A9A; --ga1:#2E6FE0; --ga2:#1B3F8F; --gb1:#E83E3E; --gb2:#8E1F2A;
  --fd:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --fb:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;

}
:root[data-theme="day"]{
  --bg:#F3F6FC; --sf:#FFFFFF; --sf2:#E2E9F6; --fg:#0A1020; --mu:#55668A; --ln:#D2DBEC;
  --a:#1F63E0; --b:#D42B2B; --ac:#E9A800; --ac-ink:#0A1020; --ac-txt:#8F6400; --ok:#0C6B3A; --warn:#B4482A;
  --a-txt:#1B4FB8; --b-txt:#B02222; --scrim:rgba(10,16,32,.5);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-transform:inherit;letter-spacing:inherit}
h1,h2,h3,h4{font-family:var(--fd);font-weight:700;line-height:1.05;margin:0;letter-spacing:.04em;text-transform:uppercase}
h2{font-size:26px}h3{font-size:19px}h4{font-size:15px}
.d{font-family:var(--fd);font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.num{font-family:var(--fd);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--fd);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}
.mu{color:var(--mu)}.small{font-size:13px}.gold{color:var(--ac-txt)}
.ca{color:var(--a-txt)}.cb{color:var(--b-txt)}
[hidden]{display:none!important}
a{color:inherit}

/* top bar */
.topbar{position:sticky;top:0;z-index:6;background:var(--bg);border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top,0px)}
.topbar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 14px}
.topbar .logo{width:22px;height:31px;background:var(--fg);-webkit-mask:var(--mark) center/contain no-repeat;mask:var(--mark) center/contain no-repeat;flex:none}
.topbar b{font-family:var(--fd);font-weight:700;letter-spacing:.18em;font-size:14px;text-transform:uppercase;white-space:nowrap}
.topbar .ctx{margin-left:auto;font-family:var(--fd);font-weight:600;letter-spacing:.14em;font-size:11px;color:var(--ac-txt);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jbtn{flex:none;padding:5px 11px;border-radius:6px;background:var(--ac);color:var(--ac-ink);font-family:var(--fd);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.mbtn{flex:none;display:flex;align-items:center;gap:5px;padding:5px 9px;border:1px solid var(--ln);border-radius:6px;background:var(--sf);font-family:var(--fd);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg)}
.mbtn{justify-content:center;width:34px;height:30px;padding:0}.mbtn i{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid currentColor;display:block}.mbtn[aria-expanded="true"] i{transform:rotate(180deg)}
.mbtn[aria-expanded="true"],.mbtn[aria-current="true"]{border-color:var(--ac);color:var(--ac-txt)}
.topbar{position:sticky}.mpop{position:absolute;right:10px;top:100%;margin-top:4px;width:min(300px,calc(100vw - 20px));background:var(--sf);border:1px solid var(--ln);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.35);padding:6px;z-index:20;display:flex;flex-direction:column;gap:2px}
.mpop>button{text-align:left;padding:8px 10px;border-radius:6px;display:flex;flex-direction:column}.mpop>button:hover{background:var(--sf2)}
.mpop b{font-family:var(--fd);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;line-height:1.1}.mpop small{font-size:11.5px;color:var(--mu)}
.msep{height:1px;background:var(--ln);margin:4px 2px}.macc{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px}.macc span{display:flex;flex-direction:column}
.tgl{width:34px;height:19px;border-radius:10px;background:var(--sf2);border:1px solid var(--ln);position:relative;flex:none;display:block}
.tgl:after{content:"";position:absolute;top:2px;left:3px;width:13px;height:13px;border-radius:50%;background:var(--ac);transition:left .15s}
:root[data-theme="day"] .tgl:after{left:16px}
.sync{font-size:10px;font-family:var(--fd);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);white-space:nowrap}
.sync.bad{color:var(--warn)}

/* score header */
.sc{position:relative;display:grid;grid-template-columns:1fr 1fr;height:112px;width:100%;border-radius:8px;overflow:hidden}
.sc .h{display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff;gap:0;min-width:0;padding:0 8px}
.sc .h.a{background:linear-gradient(160deg,var(--ga1),var(--ga2))}.sc .h.b{background:linear-gradient(200deg,var(--gb1),var(--gb2))}
.sc .tn{font-family:var(--fd);font-weight:600;letter-spacing:.16em;font-size:13px;text-transform:uppercase;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sc .tp{font-family:var(--fd);font-weight:700;font-size:64px;line-height:.95;font-variant-numeric:tabular-nums}
.sc .vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--bg);border:2px solid var(--ac);color:var(--ac-txt);min-width:34px;height:34px;padding:0 8px;white-space:nowrap;border-radius:999px;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:700;font-size:12px;letter-spacing:.04em}
.sc.small{height:52px}.sc.small .tn{font-size:12px;letter-spacing:.08em;white-space:normal;text-align:center;line-height:1.15}.sc.small .h.a{padding-right:38px}.sc.small .h.b{padding-left:38px}.sc.small .vs{font-size:13px}
.race{padding:4px 2px 0;width:100%}
.race .trk{position:relative;height:8px;background:var(--sf2);border-radius:4px;display:flex;overflow:hidden}
.race .trk i.a{background:var(--a);display:block;height:100%}.race .trk i.b{background:var(--b);display:block;height:100%;margin-left:auto}
.race .trk u{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--ac)}
.race .lab{display:flex;justify-content:space-between;font-family:var(--fd);font-weight:600;font-size:10px;letter-spacing:.14em;color:var(--mu);margin-top:4px;text-transform:uppercase}

/* banners */
.bn{margin:0;padding:8px 11px;border-radius:6px;display:flex;gap:9px;align-items:center;background:var(--sf);border-left:3px solid var(--ac);font-family:var(--fd);font-weight:700;letter-spacing:.08em;font-size:14px;line-height:1.2;text-transform:uppercase}
.bn i{width:8px;height:8px;border-radius:50%;background:var(--ac);flex:none;box-shadow:0 0 0 3px rgba(255,210,63,.22)}
.bn small{display:block;font-weight:600;font-size:10px;letter-spacing:.12em;color:var(--mu)}
.bn.risk{border-left-color:var(--b)}.bn.risk i{background:var(--b);box-shadow:0 0 0 3px rgba(255,82,82,.25)}
.bn.win{color:#fff;border-left:0}.bn.win i{background:var(--ac);box-shadow:none}.bn.win small{color:rgba(255,255,255,.8)}
.bn.win.a{background:linear-gradient(110deg,var(--ga1),var(--ga2))}.bn.win.b{background:linear-gradient(110deg,var(--gb1),var(--gb2))}
.bn.win.half{background:linear-gradient(110deg,#E9A800,#B07A00);color:#0A1020}.bn.win.half i{background:#0A1020}.bn.win.half small{color:rgba(10,16,32,.75)}
.bn.off{background:#3a2a00;color:#FFD23F;border-left:0}.bn.off i{background:#FFD23F;box-shadow:none}
.bn.ok{background:#0F3A24;color:#6EE7A5;border-left:0}.bn.ok i{background:#6EE7A5;box-shadow:none}
:root[data-theme="day"] .bn.off{background:#FFF1C9;color:#7A5200}:root[data-theme="day"] .bn.off i{background:#C98A00}
:root[data-theme="day"] .bn.ok{background:#D6F5E3;color:#0C6B3A}:root[data-theme="day"] .bn.ok i{background:#0C6B3A}
.tag{font-style:normal;font-family:var(--fd);font-weight:700;font-size:10px;letter-spacing:.12em;padding:1px 6px;border-radius:3px;text-transform:uppercase;white-space:nowrap}
.tag.live{background:var(--b);color:#fff}.tag.fin{background:var(--sf2);color:var(--mu)}.tag.dm{background:var(--b);color:#fff}.tag.dec{background:var(--ac);color:var(--ac-ink)}.tag.ok{background:#2F9E55;color:#fff}.tag.gold{border:1px solid var(--ac);color:var(--ac-txt)}

/* layout */
main{max-width:760px;margin:0 auto;padding:10px 14px calc(76px + env(safe-area-inset-bottom,0px))}
section.view{display:flex;flex-direction:column;gap:12px}
.subnav{display:flex;gap:12px;padding:6px 0 8px;border-bottom:1px solid var(--ln);font-family:var(--fd);font-weight:600;letter-spacing:.05em;font-size:12px;color:var(--mu);text-transform:uppercase;overflow-x:auto;scrollbar-width:none}
.subnav button{color:inherit;padding:4px 0;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-7px}
.subnav button[aria-current="true"]{color:var(--fg);border-bottom-color:var(--ac)}
.subnav .rt{margin-left:auto}
.seg{display:flex;gap:2px;background:var(--sf2);border-radius:999px;padding:3px;font-family:var(--fd);font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--mu);text-transform:uppercase}
.seg button{flex:1;text-align:center;padding:6px 4px;border-radius:999px;color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.seg.wrap button{white-space:normal;line-height:1.1;font-size:12px}
.seg button[aria-current="true"]{background:var(--ac);color:var(--ac-ink)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:12px 13px}
.card.flat{background:transparent;border:0;padding:0}
.rowh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.k{font-family:var(--fd);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.note{font-size:13px;color:var(--mu);line-height:1.4;text-transform:none;letter-spacing:0}
.empty{text-align:center;padding:36px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{font-size:34px}
.hero-logo{width:130px;height:254px;background:var(--fg);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}

/* match rows */
.sess{display:flex;flex-direction:column;gap:6px}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:8px 0 2px}
.sh .t{font-family:var(--fd);font-weight:700;font-size:17px;letter-spacing:.1em;text-transform:uppercase}
.sh .s{font-family:var(--fd);font-weight:600;font-size:11px;letter-spacing:.12em;color:var(--mu);text-transform:uppercase}
.sh .p{font-family:var(--fd);font-weight:700;font-size:19px;white-space:nowrap}
.m{display:flex;flex-direction:column;gap:5px;padding:9px 11px;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);width:100%;text-align:left}
.m .nm{display:flex;justify-content:space-between;gap:8px;font-family:var(--fd);font-weight:600;font-size:15px;letter-spacing:.04em}
.m .nm span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .nm span:first-child{color:var(--a-txt)}.m .nm span:last-child{color:var(--b-txt);text-align:right}
.m .nm small{font-family:var(--fb);font-size:11px;color:var(--mu);font-weight:400;letter-spacing:0}
.tug{position:relative;height:22px;background:var(--sf2);border-radius:4px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tug .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--ln)}
.tug .bar{position:absolute;top:0;bottom:0}
.tug .bar.a{right:50%;background:linear-gradient(270deg,var(--a),rgba(61,134,255,.2));border-radius:4px 0 0 4px}
.tug .bar.b{left:50%;background:linear-gradient(90deg,var(--b),rgba(255,82,82,.2));border-radius:0 4px 4px 0}
.tug b{position:relative;font-family:var(--fd);font-weight:700;font-size:15px;letter-spacing:.06em;background:var(--bg);padding:0 8px;border-radius:3px;line-height:18px;text-transform:uppercase}
.tug b.a{color:var(--a-txt)}.tug b.b{color:var(--b-txt)}
.m .meta{display:flex;gap:7px;align-items:center;font-family:var(--fd);font-weight:600;font-size:10.5px;letter-spacing:.14em;color:var(--mu);text-transform:uppercase;flex-wrap:wrap}
.m.done{opacity:.88}
.next{font-family:var(--fd);font-weight:600;font-size:12px;letter-spacing:.08em;color:var(--mu);text-transform:uppercase}.next span{color:var(--ac-txt);margin-right:5px}

/* buttons & forms */
.btn{white-space:nowrap;border:1px solid var(--ln);background:var(--sf);border-radius:6px;padding:8px 14px;font-family:var(--fd);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg)}
.btn.primary{background:var(--ac);color:var(--ac-ink);border-color:var(--ac)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.wide{width:100%;padding:11px}
.btn:disabled{opacity:.45;cursor:default}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label{font-family:var(--fd);font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
input[type=text],input[type=number],input[type=date],input[type=password],input[type=time],select,textarea{background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:8px 10px;min-width:0;width:100%;color:var(--fg);font-family:var(--fd);font-weight:600;font-size:15px;letter-spacing:.02em}
input[type=color]{width:44px;height:38px;border:1px solid var(--ln);border-radius:6px;background:var(--sf);padding:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:480px){.grid2.stack{grid-template-columns:1fr}}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;background:var(--sf);border:1px solid var(--ln);border-radius:6px;font-family:var(--fd);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.sw input{appearance:none;width:32px;height:18px;border-radius:10px;background:var(--sf2);border:1px solid var(--ln);position:relative;margin:0;flex:none}
.sw input:after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--mu)}
.sw input:checked{background:var(--ac);border-color:var(--ac)}.sw input:checked:after{left:16px;background:#0A1020}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--ln);border-radius:999px;padding:4px 11px;font-family:var(--fd);font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--mu);text-transform:uppercase}
.chips button[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;font-family:var(--fd);font-weight:600;letter-spacing:.08em;text-transform:uppercase;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.inline-confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.warnbox{background:#3a2a00;color:#FFD23F;border-radius:6px;padding:7px 10px;font-size:13px;font-weight:500}
:root[data-theme="day"] .warnbox{background:#FFF1C9;color:#7A5200}

/* bottom tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:50px}
.tabbar button{font-family:var(--fd);font-weight:600;letter-spacing:.1em;font-size:12px;color:var(--mu);text-transform:uppercase;position:relative;display:flex;align-items:center;justify-content:center}
.tabbar button[aria-current="true"]{color:var(--fg)}
.tabbar button[aria-current="true"]:before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--ac)}

/* scoring */
.hn{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hn .h{font-family:var(--fd);font-weight:700;font-size:34px;line-height:1;letter-spacing:.04em;text-transform:uppercase}
.hn .meta{font-family:var(--fd);font-weight:600;font-size:11px;letter-spacing:.14em;color:var(--mu);text-transform:uppercase}
.hn button.btn{width:auto;height:auto;font-size:12px}
.hn button{width:46px;height:44px;font-size:22px;border-radius:6px;border:1px solid var(--ln);background:var(--sf);color:var(--fg)}
.ent{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 8px 7px 11px;border-radius:6px;background:var(--sf);border-left:4px solid var(--a);position:relative}
.ent.b{border-left-color:var(--b)}
.ent .n b{font-family:var(--fd);font-weight:700;font-size:17px;letter-spacing:.04em;display:block;line-height:1.1;text-transform:uppercase}
.ent .n small{font-size:11px;color:var(--mu);display:block}
.ent .sd{font-style:normal;font-family:var(--fd);font-weight:700;font-size:10px;background:var(--ac);color:#0A1020;border-radius:2px;padding:0 4px;margin-left:5px;vertical-align:2px}
.ent .ctl{display:flex;align-items:center;gap:6px;flex:none}
.ent .ctl button{width:40px;height:40px;border-radius:6px;background:var(--sf2);font-size:20px;color:var(--fg);display:flex;align-items:center;justify-content:center}
.ent .ctl button.x{width:34px;font-family:var(--fd);font-size:14px;font-weight:700}
.ent .ctl button.x[aria-pressed="true"]{background:var(--b);color:#fff}
.ent .ctl .val{min-width:40px;text-align:center;font-family:var(--fd);font-weight:700;font-size:32px;line-height:1}
.ent .ctl .val small{display:block;font-family:var(--fb);font-size:10px;color:var(--mu);font-weight:500;line-height:1.1}
.ent .ctl button:disabled{opacity:.4}
.holeres{text-align:center;font-family:var(--fd);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding:6px;border-radius:6px;background:var(--sf2)}
.holeres.a{color:var(--a-txt)}.holeres.b{color:var(--b-txt)}
.sgp{border:1px solid var(--ac);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.sgp .k{color:var(--ac-txt)}
.sgp .row{display:grid;grid-template-columns:1fr 92px;gap:6px}
.save{background:var(--ac);color:var(--ac-ink);text-align:center;padding:10px;font-family:var(--fd);font-weight:700;letter-spacing:.14em;font-size:15px;border-radius:6px;width:100%;text-transform:uppercase}
.strokeline{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding:2px 0;-webkit-overflow-scrolling:touch}.strokeline::-webkit-scrollbar{display:none}
.strokeline button{flex:none;width:44px;height:44px;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;font-size:15px;border-radius:6px;background:var(--sf2);color:var(--mu);font-family:var(--fd);font-weight:600}
.strokeline button.a{background:var(--a);color:#fff}.strokeline button.b{background:var(--b);color:#fff}.strokeline button.h{background:var(--ln);color:var(--fg)}
.strokeline button.cur{outline:2px solid var(--ac);outline-offset:-2px}
.final{text-align:center;padding:10px;border-radius:6px;background:var(--sf2)}
.final .big{font-family:var(--fd);font-weight:700;font-size:28px;letter-spacing:.06em;text-transform:uppercase}

/* hole grid (match card) */
.hg{background:var(--sf);border-radius:6px;overflow:hidden;font-family:var(--fd)}
.hg .r{display:grid;grid-template-columns:58px repeat(9,1fr);font-size:12px;text-align:center;border-top:1px solid var(--ln);line-height:22px}
.hg .r em{font-style:normal;font-size:9px;letter-spacing:.1em;color:var(--mu);text-align:left;padding-left:7px;text-transform:uppercase;font-weight:600}
.hg .r.h{font-weight:700;background:var(--sf2);border-top:0}
.hg .r span.a{background:var(--a);color:#fff;font-weight:700}.hg .r span.b{background:var(--b);color:#fff;font-weight:700}.hg .r span.half{background:var(--ln)}
.hg .r span.bd{color:var(--ok);font-weight:700}.hg .r span.a.bd,.hg .r span.b.bd{color:#9CFFC0}

/* tables */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 7px;text-align:left;border-bottom:1px solid var(--ln);white-space:nowrap}
th{font-family:var(--fd);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:600;border-bottom:1px solid var(--ac)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:6px}
.dot.a{background:var(--a)}.dot.b{background:var(--b)}
.lead{display:flex;justify-content:space-between;align-items:center;padding:8px 11px;border:1px solid var(--ac);border-radius:6px;background:var(--sf)}
.lead b{font-family:var(--fd);font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase}

/* kpis, charts, events */
.kp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:stretch}
.kp>div{box-sizing:border-box;display:flex;flex-direction:column;min-width:0;background:var(--sf);border-radius:6px;padding:7px 8px;border-top:2px solid var(--ac)}
.kp small{display:block;font-family:var(--fd);font-weight:600;font-size:9.5px;letter-spacing:.1em;color:var(--mu);text-transform:uppercase}
.kp b{font-family:var(--fd);font-weight:700;font-size:18px;display:block;line-height:1.1;text-transform:uppercase}
.kp em{font-style:normal;font-size:11px;color:var(--mu);margin-top:auto}
.ch svg{display:block;width:100%;height:auto}
.ch .ax{display:flex;justify-content:space-between;font-family:var(--fd);font-weight:600;font-size:10px;letter-spacing:.12em;color:var(--mu);margin-top:2px;text-transform:uppercase}
.ev{display:flex;flex-direction:column}
.ev div{display:grid;grid-template-columns:52px 1fr;gap:6px;padding:5px 0;border-top:1px solid var(--ln);font-size:13px}
.ev b{font-family:var(--fd);font-weight:700;font-size:13px;color:var(--ac-txt);letter-spacing:.04em}

/* side games */
.sg{background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:9px 11px;display:flex;flex-direction:column;gap:4px}
.sg.live{border-color:var(--ac)}
.sg .k{display:flex;justify-content:space-between;align-items:center}
.sg .loc{font-family:var(--fd);font-weight:700;font-size:19px;letter-spacing:.04em;text-transform:uppercase}
.sg .loc small{font-family:var(--fb);font-size:11px;color:var(--mu);margin-left:6px;font-weight:400;text-transform:none;letter-spacing:0}
.sg .win{display:flex;align-items:center;gap:4px;border-top:1px dashed var(--ln);padding-top:6px;font-size:14px}
.sg .win .tm{color:var(--mu);font-size:11px;margin-left:5px}
.sg .win em{margin-left:auto;font-style:normal;font-family:var(--fd);font-weight:700;font-size:18px}
.sg .win.none{color:var(--mu);font-style:italic}
.tally .r{display:flex;align-items:center;padding:5px 0;border-bottom:1px solid var(--ln);font-size:14px}
.tally .r em{margin-left:auto;font-style:normal;color:var(--mu);font-size:12px;font-family:var(--fd);font-weight:600;letter-spacing:.06em}
.tot{display:flex;justify-content:space-between;font-family:var(--fd);font-weight:600;font-size:12px;letter-spacing:.1em;color:var(--mu);margin-top:8px;text-transform:uppercase}
.tot b{font-size:19px;color:var(--fg)}.tot b.a{color:var(--a-txt)}.tot b.b{color:var(--b-txt)}

/* awards */

/* golf scorecard marks: circle birdie, double circle eagle, square bogey, double square double bogey+ */
.shp{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;line-height:1;font-weight:inherit;box-sizing:border-box}
.shp.bd{border:1.2px solid currentColor;border-radius:50%}
.shp.eg{border:1.2px solid currentColor;border-radius:50%;box-shadow:0 0 0 1px var(--sf),0 0 0 2.2px currentColor}
.shp.bo{border:1.2px solid currentColor;border-radius:2px}
.shp.db{border:1.2px solid currentColor;border-radius:2px;box-shadow:0 0 0 1px var(--sf),0 0 0 2.2px currentColor}
.hg .r span.sc0{display:flex;align-items:center;justify-content:center}
.hg .r span.sc0.a .shp.eg,.hg .r span.sc0.a .shp.db{box-shadow:0 0 0 1px var(--a),0 0 0 2.2px #fff}.hg .r span.sc0.b .shp.eg,.hg .r span.sc0.b .shp.db{box-shadow:0 0 0 1px var(--b),0 0 0 2.2px #fff}
.hg .r span.ol{box-shadow:inset 0 0 0 2px var(--a)}.hg .r span.ol.b{box-shadow:inset 0 0 0 2px var(--b)}
.hg .r span.ol.a,.hg .r span.ol.b{background:none;color:inherit;font-weight:400}
.hg .r.hr span.hw{position:relative;font-size:11px}.hg .r.hr span.hw b{font-weight:700}
.hg .r.hr span.hw:after{content:"";position:absolute;left:3px;right:3px;bottom:2px;height:4px;border-radius:2px}
.hg .r.hr span.wa:after{background:var(--a)}.hg .r.hr span.wb:after{background:var(--b)}.hg .r.hr span.half:after{background:var(--ln)}
.hg .r.hr span.hw{background:none}.hg .r.hr b.ca{color:var(--a-txt)}.hg .r.hr b.cb{color:var(--b-txt)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}.legend span{display:inline-flex;align-items:center;gap:5px}.legend .shp{width:16px;height:16px;font-size:10px;color:var(--fg)}.legend .lshot{color:var(--ac-txt);font-style:normal;font-size:16px}

/* pairings: one grid per match — selects on row 1 (vs centred between them), stroke notes on row 2 */
.pair{grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr);grid-template-rows:auto auto;row-gap:4px;align-items:center}
.pair .sel.a{grid-column:1;grid-row:1}.pair .vs{grid-column:2;grid-row:1;align-self:center}.pair .sel.b{grid-column:3;grid-row:1}
.pair .strokes.sa{grid-column:1;grid-row:2}.pair .strokes.sb{grid-column:3;grid-row:2}
.pair .sel{gap:6px}
.pair select,.slot .clr{height:40px;box-sizing:border-box}
.slot .clr{width:34px}
/* session details: every input and select the same height so the two columns line up */
.card .grid2 .field input,.card .grid2 .field select{height:44px;box-sizing:border-box;width:100%;min-width:0}
.card .grid2{align-items:end}
/* iPhone: date/time inputs ignore height and overflow their column unless their native look is switched off */
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;box-sizing:border-box;text-align:left;line-height:1.2}

.card .grid2{align-items:start}.card .grid2 .field{min-width:0}
/* pairings: every slot has the same two columns, so an empty slot is as wide as a filled one */
.slot{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;align-items:center}
.slot:has(.clr){grid-template-columns:minmax(0,1fr) 34px}

/* ===== Narie Cup · core: data, maths ===== */
const COURSES_DEFAULT = {
  mazury: { name:"Mazury Golf & Country Club", short:"Mazury", tee:"Yellow", par:72, cr:70.6, slope:138,
    pars:[5,3,4,3,4,4,5,4,4, 4,4,3,5,4,4,3,5,4],

  sandvalley: { name:"Sand Valley Golf Resort, Pasłęk", short:"Sand Valley", tee:"Green", par:72, cr:69.2, slope:122, crNote:"",
    pars:[4,4,3,5,4,4,4,5,4, 3,4,5,4,3,5,4,3,4],
    si:[15,7,13,5,17,1,9,11,3, 10,2,6,14,8,4,16,12,18],

};
const FORMATS = { fourball:{label:"Fourball", per:2, allow:90, help:"Better ball of the pair, 90% of Course Handicap"}, foursomes:{label:"Foursomes", per:2, allow:50, help:"Alternate shot, 50% of combined Course Handicap"}, singles:{label:"Singles", per:1, allow:100, help:"Head to head, 100% of Course Handicap"}, scramble:{label:"Scramble", per:2, allow:35, allow2:15, team:true, help:"Both hit, play the best shot, 35% of the lower + 15% of the higher Course Handicap"} };
FORMATS.foursomes.team=true;

const FINES_DEFAULT = [ {reason:"Three-putt",amount:5}, {reason:"Lost ball",amount:5}, {reason:"Phone rang on the course",amount:20}, {reason:"Wrong tee box",amount:5}, {reason:"Forgot to rake the bunker",amount:10}, {reason:"Slow play warning",amount:10} ];
const SG_TYPES = { ntp:{label:"Nearest the pin", short:"NTP", pars:[3]}, ld:{label:"Longest drive", short:"LD", pars:[4,5]} };

/* ---------- State ---------- */
let db=null, canWrite=false, isAdmin=false, PIN="", ROWS={}, dirty=false;
const CFG = window.CUP_CONFIG || {};
const SYNC = { pending:0, offline:false, justSynced:false, failed:null };
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k,v) => { try{ v==null? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){} };
const S = { config:null, courses:null, players:{}, sessions:{}, matches:{}, sidegames:{}, sgcfg:null, ledger:{}, log:{}, loaded:false, fromCache:false, fatal:null, demo:false };

try{ const h=(location.hash||"").replace("#",""); if(h==="board"||h==="tv") UI.tv=true; else if(TABS.includes(h)) UI.tab=h; else if(h==="setup"){ UI.tab="more"; UI.moreView="setup"; } }catch(e){}

const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const maxPl = () => { const v=Math.round(num(S.config?.maxPlayers)); return v>=1&&v<=24?v:12; };
const teamCap = () => Math.ceil(maxPl()/2);
const fieldFull = () => Object.keys(S.players||{}).length>=maxPl();
const num = v => { const n = parseFloat(String(v==null?"":v).replace(",",".")); return isFinite(n)?n:0; };
const fmtPts = p => (Math.round(p*2)/2).toString().replace(".5","½").replace(/^0½$/,"½");
const P = id => S.players[id] || {name:"—", team:"A", hi:0};
const pname = id => P(id).name || "Unnamed";
const first = id => pname(id).split(" ")[0];

/* ---------- Handicap maths (WHS) ---------- */
function courseFor(s){ return S.courses?.[s.course] || COURSES_DEFAULT[s.course] || COURSES_DEFAULT.mazury; }
const hcpOn = id => P(id).hcp!==false;
const pCH = (id, course) => hcpOn(id) ? courseHandicap(P(id).hi, course) : 0;
function courseHandicap(hi, course){ return Math.round(num(hi) * num(course.slope)/113 + (num(course.cr) - num(course.par))); }
function entitiesFor(m, s){
  if(teamBall(s)) return { a:[{id:"a", players:m.a||[], side:"a"}], b:[{id:"b", players:m.b||[], side:"b"}] };
  return { a:(m.a||[]).map(p=>({id:p, players:[p], side:"a"})), b:(m.b||[]).map(p=>({id:p, players:[p], side:"b"})) };
}
function strokeMap(m, s){
  const E = entitiesFor(m,s), all=[...E.a,...E.b], out={};
  if(!S.config?.handicaps){ all.forEach(e=>out[e.id]=0); return out; }
  const course = courseFor(s);
  const allow = num(S.config.allow?.[s.format] ?? FORMATS[s.format].allow)/100;
  const allow2 = num(S.config.allow?.[s.format+"2"] ?? FORMATS[s.format].allow2 ?? 0)/100;
  const ph = all.map(e => { const ch=e.players.map(p=>pCH(p, course)).sort((x,y)=>x-y);
    if(s.format==="scramble") return Math.round((ch[0]||0)*allow + (ch[1]||0)*allow2);
    return Math.round(ch.reduce((t,v)=>t+v,0) * allow); });
  const valid = all.filter(e=>e.players.length>0);
  const min = valid.length ? Math.min(...valid.map(e=>ph[all.indexOf(e)])) : 0;
  all.forEach((e,i)=> out[e.id] = e.players.length ? ph[i]-min : 0);
  return out;
}
const strokesOnHole = (n, si) => Math.floor(n/18) + (si <= (n%18) ? 1 : 0);
function holeResult(m, s, h){
  const E=entitiesFor(m,s); if(!E.a.length||!E.b.length) return null;
  const sm=strokeMap(m,s), si=courseFor(s).si[h-1];
  const net = side => { let best=null; for(const e of side){ const g=m.holes?.[h]?.[e.id]; if(g==null) return undefined; const n = g===0?Infinity: g - strokesOnHole(sm[e.id]||0, si); best = best==null?n:Math.min(best,n);} return best; };
  const na=net(E.a), nb=net(E.b); if(na===undefined||nb===undefined) return null;
  if(na===Infinity&&nb===Infinity) return "half"; return na<nb?"a":na>nb?"b":"half";
}
const startOf = m => { const v=Math.round(+(m&&m.start)||1); return v>=1&&v<=18?v:1; };
const holeOrder = m => { const st=startOf(m); return Array.from({length:18},(_,i)=>((st-1+i)%18)+1); };
const nextInOrder = (m,h,d) => { const o=holeOrder(m), i=o.indexOf(h)+d; return i>=0&&i<18?o[i]:null; };

/* Finished matches: the players in the match can fix scores for 15 minutes after the last score, or until someone confirms the result. Admin can always edit, after a confirm step. */
const EDIT_WINDOW_MS = 15*60*1000;
function matchLock(m,s){
  const st=matchState(m,s); if(!st.closed) return {closed:false, locked:false};
  if(m.override) return {closed:true, locked:true, why:"result"};
  if(m.confirmed) return {closed:true, locked:true, why:"confirmed", by:m.confirmed.by, at:m.confirmed.at};
  const last=m.lastAt?Date.parse(m.lastAt):0; const until=last?last+EDIT_WINDOW_MS:0;

}
const inMatch = m => { const me=typeof meId==="function"?meId():null; return !!me && [...(m.a||[]),...(m.b||[])].includes(me); };

function lockBanner(m,s,L){

    return `<div class="bn need fin2"><i></i><span>Match finished<small>Players in this match can fix scores until ${hhmm(L.until)}</small></span>${canConfirm?`<button class="btn sm primary" data-action="confirm-result" style="margin-left:auto">Confirm result</button>`:""}</div>`; }
  const sub = L.why==="confirmed" ? `Result confirmed by ${esc(L.by||"a player")}` : L.why==="result" ? "Result set by admin" : "Scores are locked";
  return `<div class="bn need"><i></i><span>Match is final<small>${sub}</small></span>${isAdmin?(UI.adminEdit===m.id?`<span class="tag gold" style="margin-left:auto">Editing</span>`:`<button class="btn sm" data-action="confirm" data-key="admin-edit" style="margin-left:auto">Edit scores</button>`):""}</div>

}

/* ---------- Side games ---------- */
function renderGames(){
  const ss=sessionsSorted(); if(!ss.length) return `<div class="empty"><h2>No sessions yet</h2></div>`;
  if(UI.gamesDay==null) UI.gamesDay=currentSession()?.id||ss[0].id;
  const s=S.sessions[UI.gamesDay]||ss[0]; const c=courseFor(s); const items=sgAll().filter(g=>g.s.id===s.id);
  const liveHole = (()=>{ let mx=0; for(const m of matchesOf(s.id)){ const st=matchState(m,s); if(!st.closed) mx=Math.max(mx,st.thru); } return mx+1; })();
  const card=g=>{ const e=g.e; const live=!e?.winner && g.h>=liveHole-1 && g.h<=liveHole+2 && matchesOf(s.id).some(m=>{const st=matchState(m,s); return st.ready&&!st.closed;});
    return `<div class="sg ${live?"live":""}"><div class="k"><span>${esc(SG_TYPES[g.type].label)}</span>${live?`<em class="tag dec">In play</em>`:""}</div><div class="loc">Hole ${g.h}<small>Par ${c.pars[g.h-1]} · SI ${c.si[g.h-1]}${c.m?.[g.h-1]?` · ${c.m[g.h-1]} m`:""}</small></div>
      ${e?.winner?`<div class="win"><span class="dot ${P(e.winner).team==="A"?"a":"b"}"></span><b>${esc(pname(e.winner))}</b><span class="tm">${esc(teamOf(P(e.winner).team).name)}</span><em>${e.dist?`${e.dist} ${unitTxt()}`:""}</em></div>`:`<div class="win none">Winner not set yet${canWrite?" · enter it on the score screen at that hole":""}</div>`}</div>`; };
  const T=sgTally(); const rows=Object.entries(T).sort((a,b)=>(b[1].ntp+b[1].ld)-(a[1].ntp+a[1].ld));
  const tm={a:0,b:0}; rows.forEach(([id,r])=>tm[P(id).team==="A"?"a":"b"]+=r.ntp+r.ld);
  return `<section class="view">
    <div class="seg">${ss.map((x,i)=>`<button data-gday="${x.id}" aria-current="${UI.gamesDay===x.id}">Day ${i+1}</button>`).join("")}</div>
    <div class="eyebrow">${esc(c.name)} · ${esc(fmtDate(s.date))}</div>
    ${items.length?items.map(card).join(""):`<p class="note">No side-game holes chosen for this day.${canWrite?" Pick them under Setup › Games in the ▾ menu.":""}</p>`}
    <div class="card"><div class="rowh"><h3>Leaderboard</h3><span class="small mu">all three days</span></div>
      ${rows.length?`<div class="tally">${rows.map(([id,r])=>`<div class="r"><span class="dot ${P(id).team==="A"?"a":"b"}"></span>${esc(pname(id))}<em>${r.ntp?`${r.ntp} NTP${r.best.ntp?` (${r.best.ntp} ${unitTxt()})`:""}`:""}${r.ntp&&r.ld?" · ":""}${r.ld?`${r.ld} LD${r.best.ld?` (${r.best.ld} ${unitTxt()})`:""}`:""}</em></div>`).join("")}</div>`:`<p class="note">No winners yet.</p>`}
      <div class="tot"><span><b class="a">${tm.a}</b> ${esc(tname("a"))}</span><span>${esc(tname("b"))} <b class="b">${tm.b}</b></span></div>
</div>
  </section>`;
}

function spRound(pid,s){
  const c=courseFor(s), ch=spHcp(pid,s), hs=spCard(s.id,pid)?.holes||{};

function spTotal(pid){ let thru=0,gross=0,net=0,par=0,rounds=0,birdies=0; for(const s of sessionsSorted()){ const r=spRound(pid,s); if(!r.thru) continue; rounds++; thru+=r.thru; gross+=r.gross; net+=r.net; par+=r.par; birdies+=r.birdies; } return {thru,gross,net,par,toPar:net-par,grossToPar:gross-par,rounds,birdies}; }

function spBoard(sid){

  const ss=sessionsSorted(), tid=spTodaySid(), ts=S.sessions[tid], ti=ss.findIndex(x=>x.id===tid);

    const before=spRank(spField().map(p=>{ let thru=0,gross=0,net=0,par=0; ss.slice(0,ti).forEach(x=>{ const r=spRound(p.id,x); thru+=r.thru; gross+=r.gross; net+=r.net; par+=r.par; }); return {p, r:{thru,gross,toPar:net-par}}; }));

function mineResult(st,sd){ if(!st.ready) return {txt:"—",cls:""}; if(st.closed){ if(st.winner==="half") return {txt:"½",cls:"h",word:"Halved"}; return st.winner===sd?{txt:st.text,cls:sd,word:"Won"}:{txt:st.text,cls:sd==="a"?"b":"a",word:"Lost"}; } if(st.thru===0) return {txt:"vs",cls:""}; const d=sd==="a"?st.diff:-st.diff; return {txt:d===0?"AS":`${Math.abs(d)} ${d>0?"UP":"DN"}`,cls:d>0?sd:d<0?(sd==="a"?"b":"a"):"",live:true}; }

  const B=birdieStats()[id]||{birdie:0,eagle:0,par:0,netBirdie:0}; const SG=sgTally()[id]||{ntp:0,ld:0};

  if(UI.ledgerForm) return ledgerForm(ps);
  if(UI.ledgerTab==="settle"){ const sug=settleSuggestions(); const rows=Object.entries(bal).sort((a,b)=>a[1]-b[1]); const mx=Math.max(1,...rows.map(r=>Math.abs(r[1])));
    return `<section class="view">${backBar("Settle up",`<button class="btn sm" data-ledger="all">‹ Bets</button>`)}
      <div class="card bal"><div class="k" style="margin-bottom:4px">Net balances · bets and open fines</div>${rows.length?rows.map(([id,v])=>`<div class="p"><span>${esc(first(id))}</span><i class="${v<0?"neg":"pos"}" style="width:${Math.abs(v)/mx*100}%"></i><b>${v>0?"+":""}${Math.round(v)} ${cur()}</b></div>`).join(""):`<p class="note">Nothing open.</p>`}</div>
      <div class="k">Suggested payments</div>

      <div class="card"><div class="k">Fines pot</div><div style="display:flex;align-items:baseline;gap:10px"><b class="num" style="font-size:24px;font-weight:700">${money(pot)}</b><span class="small mu">${{dinner:"for the dinner bill",charity:"for charity"}[S.config.ledger?.potUse]||"use to be decided"} · ${money(paid)} collected</span></div></div></section>`; }
  const filt = list.filter(e=>UI.ledgerTab==="all"||(UI.ledgerTab==="fines"&&e.kind==="fine")||(UI.ledgerTab==="bets"&&e.kind==="bet"));
  const row=e=>{ const br=betResult(e); const paidTag=e.kind==="bet"&&br.state==="pending"?`<span class="st open">${br.live?"Live":"Pending"}</span>`:e.kind==="bet"&&br.state==="push"?`<span class="st paid">No bet</span>`:`<span class="st ${e.paid?"paid":"open"}">${e.paid?"Paid":"Open"}</span>`;
    const who = e.kind==="bet" ? `${first(e.who)} vs ${first(e.who2)}` : pname(e.who);
    const ed=(e.edits||[]); const hist=UI.ledgerHist===e.id?`<div class="hist"><b>Entry history</b><p>Added by ${esc(e.createdBy||"unknown")}${e.created?` · ${fmtAt(e.created)}`:""}</p>${ed.map(x=>`<p><b>${esc(x.by)}</b> · ${fmtAt(x.at)}<br><span>${esc((x.changes||[]).join("; "))}</span></p>`).join("")}</div>`:"";
    return `<div class="lew"><button class="le" data-action="ledger-edit" data-id="${e.id}"><i class="dot ${P(e.who).team==="A"?"a":"b"}"></i><div class="w"><b>${esc(who)}</b><small>${e.kind==="bet"?"Bet":"Fine"} · ${esc(e.reason||"")}${e.when?` · ${esc(e.when)}`:""}${e.kind==="bet"&&e.match&&S.matches[e.match]?(isStroke()?"":` · ${esc(first(e.who))} backs ${esc(teamOf((e.pick||"a").toUpperCase()).name)}`):""}${e.kind==="bet"&&br.state==="done"&&br.winner?` · ${esc(first(br.winner))} won`:""}${br.state==="push"?" · match halved":""}</small></div><div class="r"><b>${money(e.amount)}</b>${paidTag}</div></button>${ed.length?`<span class="edot${e.kind==="bet"?" bang":""}" role="button" tabindex="0" aria-label="Edited. Show who edited" data-action="ledger-history" data-id="${e.id}">${e.kind==="bet"?"!":""}</span>`:""}${hist}</div>`; };
  const top=Object.entries(list.filter(e=>e.kind==="fine").reduce((a,e)=>{a[e.who]=(a[e.who]||0)+num(e.amount);return a;},{})).sort((a,b)=>b[1]-a[1]).slice(0,3);

}

  const t=totals(); const A=teamOf("A"), B=teamOf("B"); const ss=sessionsSorted(); const cs=currentSession();
  const ctl=`<div class="tvctl"><button class="btn sm" data-action="theme-flip">Day / Night</button><button class="btn sm" data-action="exit-board">Exit</button></div>`;
  if(t.winner){ const aw=awards(); const w=t.winner;
    return `<section class="view">${ctl}<div class="tvsc fin"><div class="h a"><div><div class="tn">${w==="a"?"Champions":w==="half"?"Square":"Runners-up"}</div><div class="tn" style="font-size:clamp(20px,3.2vw,44px);font-weight:700">${esc(A.name)}</div></div></div><div class="mid"><i class="lg"></i><span style="font-size:clamp(28px,5vw,64px)">${fmtPts(t.a)} – ${fmtPts(t.b)}</span><small>${esc(S.config.name)} · Final${w==="half"?(t.holder?` · ${esc(tname(t.holder))} keep the Cup`:" · shared"):""}</small></div><div class="h b"><div style="text-align:right"><div class="tn">${w==="b"?"Champions":w==="half"?"Square":"Runners-up"}</div><div class="tn" style="font-size:clamp(20px,3.2vw,44px);font-weight:700">${esc(B.name)}</div></div></div></div>
      <div class="tvfin"><div>${ss.map(s=>{const p=t.perSession[s.id]; const tot=p.a+p.b||1; return `<div class="dr"><span>${esc(s.label)}</span><div class="dbar"><i class="a" style="width:${p.a/tot*100}%"></i><i class="b" style="width:${p.b/tot*100}%"></i></div><b>${fmtPts(p.a)} – ${fmtPts(p.b)}</b></div>`;}).join("")}</div>
      <div style="display:flex;flex-direction:column;gap:8px">${aw.slice(0,4).map(a=>`<div class="aw ${a.ids.length?(P(a.ids[0]).team==="A"?"a":"b"):"none"}"><div class="ic">★</div><div><small>${esc(a.t)}</small><b>${esc(a.who||"—")}</b><em>${esc(a.stat)}</em></div></div>`).join("")}</div></div></section>`; }
  const b=clinchBanner(t); const sgw=sgAll().filter(g=>g.e?.winner).slice(-2);
  const row=m=>{ const st=matchState(m,cs), lab=statusLabel(m,cs,st); const lead=st.diff||0; const w=Math.min(Math.abs(lead),4)/4*48; const bar=lead?`<i class="bar ${lead>0?"a":"b"}" style="width:${w}%"></i>`:"";
    return `<div class="tvm"><span class="l">${esc(sideTxt(m.a))}</span><div class="tug"><i class="mid"></i>${bar}<b class="${lab.cls}">${esc(lab.big)}</b></div><span class="r">${esc(sideTxt(m.b))}</span><span class="mt">${st.closed?`<em class="tag fin">Final</em>`:st.thru>0?`<em class="tag live">Live</em>`:""}${st.dormie?`<em class="tag dm">Dormie</em>`:""}<span>${esc(lab.sub)}</span></span></div>`; };
  return `<section class="view">${ctl}
    <div class="tvsc"><div class="h a"><b>${fmtPts(t.a)}</b><span class="tn">${esc(A.name)}</span></div><div class="mid"><i class="lg"></i><span>${esc(S.config.name)}</span><small>${cs?esc(cs.label):""}${cs?" · "+esc(courseFor(cs).short||""):""}</small></div><div class="h b"><span class="tn">${esc(B.name)}</span><b>${fmtPts(t.b)}</b></div></div>
    ${b?`<div class="tvtick ${b.cls.includes("risk")?"risk":""}"><i></i><b>${esc(b.text)}</b><span>${esc(b.sub)}</span></div>`:""}
    <div class="tvlist">${cs?matchesOf(cs.id).map(row).join(""):""}</div>
    <div class="tvsess">${ss.map(s=>`<span>${esc(s.label.split("·")[0].trim())} <b>${fmtPts(t.perSession[s.id].a)}–${fmtPts(t.perSession[s.id].b)}</b></span>`).join("")}<span>First to <b>${fmtPts(t.need)}</b></span></div>
    <div class="tvfoot">${sgw.map(g=>`<span>${SG_TYPES[g.type].label} · H${g.h} <b>${esc(first(g.e.winner))}</b>${g.e.dist?` ${g.e.dist} ${unitTxt()}`:""}</span>`).join("")||`<span>${SYNC.offline?"Offline · last known scores":"Updates live as scores come in"}</span>`}</div></section>`;
}

/* ===== writes ===== */
function enqueue(fn){ return Promise.resolve().then(fn).catch(e=>{ console.warn(e);
  if(e?.code==="bad_pin"){ setUnlocked(false,null); }
  if(!e?.handled) toast("Save failed: "+(e?.message||e)); scheduleRender(); }); }
function needAdmin(){ if(!needDb()) return false; if(!isAdmin) return false; return true; }
function editorName(){ const p=meId()&&S.players[meId()]; return p?p.name:(isAdmin?"Admin":"Someone"); }
function needDb(){ if(!db){ toast("Not connected to the database."); return false; } if(!canWrite){ showPin(); return false; } if(S.config?.closed && !isAdmin){ toast("The Cup is closed."); return false; } return true; }
function setupLocked(){ return !!S.config?.locked && !isAdmin; }
function needSetup(){ if(!needDb()) return false; if(!isAdmin) return false; return true; }
function logAct(text,id){ if(!db) return; const rec={at:new Date().toISOString(),by:editorName(),text}; enqueue(()=>db.doc("log/"+(id||newId())).set(rec)); }
function teamsLocked(){ return !!S.config?.teamsLocked && !isAdmin; }
function canEditPlayer(id){ if(isAdmin) return true; const t=myCaptainTeam(); return !!(canWrite && t && !S.config?.closed && !S.config?.teamsLocked && S.players[id]?.team===t); }
function exportData(){ return JSON.stringify({app:"Narie Cup",exported:new Date().toISOString(),rows:ROWS},null,1); }
const newId = () => Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
function go(tab, extra={}){ UI.tab=tab; UI.confirm=null; Object.assign(UI, extra); try{ history.replaceState(null,"","#"+tab);}catch(x){} window.scrollTo(0,0); render(); toTop(); }
function toTop(){ const f=()=>{ window.scrollTo(0,0); document.documentElement.scrollTop=0; document.body.scrollTop=0; }; f(); requestAnimationFrame(f); }
try{ if("scrollRestoration" in history) history.scrollRestoration="manual"; }catch(e){}
window.addEventListener("load",()=>{ if(!/#board/.test(location.hash)) toTop(); });
/* iOS: after the keyboard closes the page can stay shifted up, leaving the top bar off-screen. Nudge it back. */
document.addEventListener("focusout",()=>{ setTimeout(()=>{ const a=document.activeElement; if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return; const vv=window.visualViewport; if(vv&&vv.offsetTop>0) window.scrollTo(window.scrollX, window.scrollY); else window.scrollBy(0,0); document.documentElement.style.setProperty("--toph", (document.getElementById("top")?.offsetHeight||48)+"px"); },60); });

function createTournament(){
  if(!needDb()) return;
  enqueue(async()=>{
    await db.doc("tournament/config").set({ name:"Narie Cup 2026", teamA:{name:"Team Lake",color:"#3D86FF"}, teamB:{name:"Team Forest",color:"#FF5252"}, handicaps:true, allow:{singles:100,fourball:90,foursomes:50}, tie:"shared", awards:{spoon:true,custom:[]}, ledger:{currency:"zł",potUse:"later",fines:FINES_DEFAULT}, created:new Date().toISOString() });
    await db.doc("tournament/courses").set(clone(COURSES_DEFAULT));
    await db.doc("sidegames/config").set({ unit:"m", eligibility:"field", points:0, holes:{ s1:{ntp:[4,16],ld:[7,13]}, s2:{ntp:[2,12],ld:[1,17]}, s3:{ntp:[3,14],ld:[8,12]} } });
    const defs=[ {id:"s1",order:1,date:"2026-10-16",time:"10:00",label:"Day 1 · Fourball",format:"fourball",course:"mazury",n:3},
                 {id:"s2",order:2,date:"2026-10-17",time:"08:30",label:"Day 2 · Foursomes",format:"foursomes",course:"mazury",n:3},
                 {id:"s3",order:3,date:"2026-10-18",time:"09:00",label:"Day 3 · Singles",format:"singles",course:"sandvalley",n:6} ];
    for(const d of defs){ const {n,...s}=d; await db.doc("sessions/"+s.id).set(s); for(let i=1;i<=n;i++) await db.doc(`matches/${s.id}m${i}`).set({session:s.id,order:i,a:[],b:[],holes:{}}); }
    toast("Tournament created. Add your players.");
  });
  UI.tab="more"; UI.moreView="players"; render();
}
function setCfg(path, value){ if(!needSetup()) return; enqueue(async()=>{ const parts=path.split("."); let obj={}; let c=obj; parts.forEach((p,i)=>{ if(i===parts.length-1) c[p]=value; else { c[p]={}; c=c[p]; } }); await db.doc("tournament/config").update(obj); }); }
function addPlayer(team){ if(!needAdmin()) return; const id=newId(); const order=Object.keys(S.players).length+1; enqueue(()=>db.doc("players/"+id).set({name:"",team,hi:0,captain:false,order})); }
function updateMatchSide(mid, side, i, pid){ if(!needDb()) return; if(!isAdmin){ const mm=S.matches[mid]; if(setupLocked()||myCaptainTeam()!==side.toUpperCase()||(mm&&matchState(mm,S.sessions[mm.session]).thru>0)) { render(); return; } } const m=S.matches[mid]; if(!m) return; const s=S.sessions[m.session]; const per=FORMATS[s.format].per; const arr=[...(m[side]||[])]; while(arr.length<per) arr.push(""); arr[i]=pid; enqueue(()=>db.doc("matches/"+mid).update({[side]:arr.filter(Boolean)})); }
function setScore(mid, eid, val){ if(!needDb()) return; enqueue(()=>db.doc("matches/"+mid).update({holes:{[String(UI.hole)]:{[eid]:val}}, lastAt:new Date().toISOString()})); }
function setSg(key, f, v){ if(!needDb()) return; const [sid,type,h]=key.split("_"); enqueue(()=>db.doc("sidegames/"+key).update({session:sid,type,hole:+h,[f]:v})); }

/* ===== events ===== */
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && UI.menu){ UI.menu=false; renderTop(); } });
document.addEventListener("click", e=>{
  { const ae=document.activeElement; if(ae&&ae!==document.body&&ae.matches("input,select,textarea")&&ae!==e.target&&e.target.closest&&e.target.closest("button")) ae.blur(); }
  const tabBtn=e.target.closest("[data-tab]"); if(tabBtn){ UI.menu=false; UI.matchId = tabBtn.dataset.tab==="score"?UI.matchId:null; UI.moreView=null; UI.card=false; UI.tv=false; if(tabBtn.dataset.tab==="bets"){ UI.ledgerTab="bets"; UI.ledgerForm=null; } go(tabBtn.dataset.tab); return; }
  const d=e.target.closest("[data-day]"); if(d){ UI.day=d.dataset.day; render(); return; }
  const gd=e.target.closest("[data-gday]"); if(gd){ UI.gamesDay=gd.dataset.gday; render(); return; }
  const stt=e.target.closest("[data-stats]"); if(stt){ UI.statsTab=stt.dataset.stats; render(); return; }
  const su=e.target.closest("[data-setup]"); if(su){ UI.setupTab=su.dataset.setup; UI.confirm=null; render(); return; }
  const th=e.target.closest("[data-themepick]"); if(th){ setTheme(th.dataset.themepick); render(); return; }
  const pt=e.target.closest("[data-ptab]"); if(pt){ UI.playersTab=pt.dataset.ptab; render(); return; }
  const lt=e.target.closest("[data-ledger]"); if(lt){ UI.ledgerTab=lt.dataset.ledger; UI.ledgerForm=null; render(); return; }
  const lg=e.target.closest("[data-lang]"); if(lg){ setLang(lg.dataset.lang); return; }
  const lbt=e.target.closest("[data-lbtype]"); if(lbt&&UI.ledgerForm){ const f=UI.ledgerForm; f.btype=lbt.dataset.lbtype; if(f.btype==="own") f.match=""; else f.winner=""; render(); return; }
  const lpk=e.target.closest("[data-lpick]"); if(lpk&&UI.ledgerForm){ UI.ledgerForm.pick=lpk.dataset.lpick; render(); return; }
  const lk=e.target.closest("[data-lkind]"); if(lk&&UI.ledgerForm){ UI.ledgerForm.kind=lk.dataset.lkind; render(); return; }
  const lr=e.target.closest("[data-lreason]"); if(lr&&UI.ledgerForm){ UI.ledgerForm.reason=lr.dataset.lreason; UI.ledgerForm.amount=num(lr.dataset.amt); render(); return; }
  const sgh=e.target.closest("[data-sgh]"); if(sgh){ if(!needDb()) return; const sid=sgh.dataset.sgh, type=sgh.dataset.type, h=+sgh.dataset.h; const cur=sgHoles(sid,type); const nxt=cur.includes(h)?cur.filter(x=>x!==h):[...cur,h].sort((a,b)=>a-b); const holes=clone(S.sgcfg?.holes||{}); holes[sid]=holes[sid]||{}; holes[sid][type]=nxt; enqueue(()=>db.doc("sidegames/config").set({...(S.sgcfg||{unit:"m",eligibility:"field",points:0}),holes})); return; }
  const el=e.target.closest("[data-action]");
  if(UI.menu && (!el || el.dataset.action!=="menu") && !(e.target.closest("#menu") && !el)){ UI.menu=false; renderTop(); }
  if(!el) return; const a=el.dataset.action;
  const m = UI.matchId && S.matches[UI.matchId]; const s = m && S.sessions[m.session];
  switch(a){
    case "create": createTournament(); break;
    case "menu": UI.menu=!UI.menu; renderTop(); break;
    case "pin": showPin(); break;
    case "join": showJoin(); break;
    case "pin-cancel": hideModal(); break;
    case "lock": setUnlocked(false,null); toast("Locked. View only on this device."); break;
    case "theme-flip": { const now=document.documentElement.dataset.theme; setTheme(now==="day"?"night":"day"); render(); break; }
    case "home": UI.matchId=null; go("home"); break;
    case "final": go("home"); document.getElementById("main").innerHTML=renderFinal(); window.scrollTo(0,0); break;
    case "board": UI.tv=true; try{ history.replaceState(null,"","#board");}catch(x){} render(); break;
    case "exit-board": UI.tv=false; go("home"); break;
    case "more-view": UI.moreView=el.dataset.view||null; if(UI.moreView==="players") UI.playersTab="all"; UI.confirm=null; UI.ledgerForm=null; if(UI.tab!=="more") UI.tab="more"; window.scrollTo(0,0); render(); toTop(); break;
    case "player": UI.prev={tab:UI.tab,moreView:UI.moreView,statsTab:UI.statsTab,playersTab:UI.playersTab,y:window.scrollY}; UI.playerId=el.dataset.id; UI.menu=false; UI.tab="more"; UI.moreView="player"; window.scrollTo(0,0); render(); break;
    case "player-back": { const pv=UI.prev||{tab:"more",moreView:"players"}; Object.assign(UI,{tab:pv.tab,moreView:pv.moreView,statsTab:pv.statsTab||UI.statsTab,playersTab:pv.playersTab||UI.playersTab}); render(); window.scrollTo(0,pv.y||0); break; }
    case "player-card": { UI.matchId=el.dataset.id; UI.card=true; UI.moreView=null; const mm=S.matches[UI.matchId], ss=S.sessions[mm.session]; const st=matchState(mm,ss); UI.hole = st.closed? (st.last||startOf(mm)) : (st.next||startOf(mm)); go("score"); break; }
    case "open-match": UI.matchId=el.dataset.id; UI.card=!canWrite; { const mm=S.matches[UI.matchId], ss=S.sessions[mm.session]; const st=matchState(mm,ss); UI.hole = st.closed? (st.last||startOf(mm)) : (st.next||startOf(mm)); } go("score"); break;
    case "card": UI.card=true; render(); window.scrollTo(0,0); break;
    case "card-close": UI.card=false; render(); break;
    case "back": UI.adminEdit=null; UI.matchId=null; UI.card=false; if(isStroke()){ go("home"); break; } render(); break;
    case "sp-open": case "sp-score": { const pid=el.dataset.id; const sid=el.dataset.sid||spRoundSid(); UI.spSid=sid; UI.spPid=pid; const ss=S.sessions[sid]; const hs=spCard(sid,pid)?.holes||{}; let nh=1; while(nh<18&&hs[nh]!=null) nh++; UI.hole=nh; if(a==="sp-score"||canWrite){ const g=spGroup(); if(!g.includes(pid)) spSetGroup(g.length>=4?[pid]:[...g,pid]); UI.card=false; } else UI.card=true; go("score"); break; }
    case "sp-card": UI.spPid=el.dataset.id; UI.card=true; render(); window.scrollTo(0,0); break;
    case "sp-remove": spSetGroup(spGroup().filter(x=>x!==el.dataset.p)); render(); break;
    case "sp-inc": case "sp-dec": case "sp-pick": { const pid=el.dataset.p; const sid=UI.spSid&&S.sessions[UI.spSid]?UI.spSid:spRoundSid(); const ss=S.sessions[sid]; if(!ss) break; const par=courseFor(ss).pars[UI.hole-1]; const g=spCard(sid,pid)?.holes?.[UI.hole]; let v; if(a==="sp-pick") v=g===0?null:0; else if(a==="sp-inc") v=(g==null||g===0)?par:Math.min(15,g+1); else v=(g==null)?par:g===0?null:(g<=1?null:g-1); try{ navigator.vibrate&&navigator.vibrate(12); }catch(x){} spWrite(pid,v); break; }
    case "prev": { const mm=S.matches[UI.matchId]; UI.hole=(mm&&nextInOrder(mm,UI.hole,-1))||Math.max(1,UI.hole-1); render(); break; }
    case "next": { const mm=S.matches[UI.matchId]; UI.hole=(mm&&nextInOrder(mm,UI.hole,1))||Math.min(18,UI.hole+1); } render(); window.scrollTo(0,0); break;
    case "go-score": UI.matchId=null; go("score"); break;
    case "goto-card": UI.hole=+el.dataset.h; UI.card=false; render(); window.scrollTo(0,0); break;
    case "goto": UI.hole=+el.dataset.h; render(); break;
    case "inc": case "dec": case "pickup": { if(!m||!s) break; const eid=el.dataset.e; const c=courseFor(s); const g=m.holes?.[UI.hole]?.[eid];
      if(matchState(m,s).closed){ if(!canEditScores(m,s)){ toast(inMatch(m)||!matchLock(m,s).locked?"Match is final.":"Only the players in this match can fix scores now."); break; }
        if(isAdmin && matchLock(m,s).locked && UI.adminEdit!==m.id){ UI.confirm="admin-edit"; render(); break; } }
      let v; if(a==="pickup") v = g===0?null:0; else if(a==="inc") v = (g==null||g===0)? c.pars[UI.hole-1] : Math.min(15,g+1); else v = (g==null)? c.pars[UI.hole-1] : g===0? null : (g<=1? null : g-1);
      if(isAdmin && matchState(m,s).closed){ const lid="sc_"+m.id+"_"+UI.hole+"_"+eid; const prev=S.log[lid]; const from=prev&&prev.from!==undefined?prev.from:(g==null?"–":g===0?"X":g); const nn=v==null?"–":v===0?"X":v; enqueue(()=>db.doc("log/"+lid).set({at:new Date().toISOString(),by:editorName(),from,text:`Admin corrected a final score · ${s.label} m${m.order} · H${UI.hole} · ${(()=>{ const en=entitiesFor(m,s); const e=[...en.a,...en.b].find(x=>x.id===eid); return e?(s.format==="foursomes"?e.players.map(first).join(" / "):pname(e.id)):eid; })()}: ${from} → ${nn}`})); }
      try{ navigator.vibrate&&navigator.vibrate(12); }catch(x){}
      setScore(m.id, eid, v); break; }
    case "confirm-result": { if(!m||!s||!needDb()) break; if(!isAdmin&&!inMatch(m)) break; const by=editorName(); enqueue(()=>db.doc("matches/"+m.id).update({confirmed:{by,at:new Date().toISOString()}})); logAct(`${by} confirmed the result · ${s.label} · match ${m.order}`); toast("Result confirmed."); break; }
    case "admin-edit": if(!needAdmin()) break; UI.adminEdit=UI.matchId; UI.confirm=null; render(); break;
    case "retry-save": retryFailed(); break;
    case "dismiss-fail": SYNC.failed=null; render(); break;
    case "override-menu": if(!needAdmin()) break; if(m?.override){ enqueue(()=>db.doc("matches/"+m.id).update({override:null})); logAct(`Admin cleared the result · ${s.label} · match ${m.order}`); } else { UI.confirm="override"; render(); } break;
    case "reset-match": { if(!needAdmin()||!m) break; UI.confirm=null; enqueue(()=>db.doc("matches/"+m.id).set({session:m.session,order:m.order,a:m.a||[],b:m.b||[],holes:{}})); logAct(`Admin reset ${s.label} · match ${m.order}`); toast("Match scores cleared."); break; }
    case "override": { if(!needAdmin()) break; const w=el.dataset.w; logAct(`Admin set result · ${s.label} · match ${m.order}: ${w==="half"?"halved":tname(w)+" win"}`); UI.confirm=null; enqueue(()=>db.doc("matches/"+m.id).update({override:{winner:w, text:w==="half"?"Halved":"W/O"}})); break; }
    case "confirm": UI.confirm=el.dataset.key; render(); break;
    case "cancel": UI.confirm=null; render(); break;
    case "clear-slot": { if(!needAdmin()) break; const mm=S.matches[el.dataset.mid]; if(!mm) break; const sd=el.dataset.side, idx=+el.dataset.i; const who=(mm[sd]||[])[idx]; const arr=(mm[sd]||[]).filter((_,k)=>k!==idx); enqueue(()=>db.doc("matches/"+mm.id).update({[sd]:arr})); logAct(`Admin removed ${pname(who)} from ${S.sessions[mm.session]?.label||"a session"} · match ${mm.order}`); break; }
    case "admin-add-player": { if(!needAdmin()) break; const nm=(document.getElementById("apname")?.value||"").trim(); const hi=num(document.getElementById("apix")?.value); const tm=document.getElementById("apteam")?.value||""; if(!nm){ toast("Type a nickname."); break; } if(Object.values(S.players).some(x=>(x.name||"").toLowerCase()===nm.toLowerCase())){ toast("That nickname is already in the list."); break; } if(fieldFull()){ toast(`The tournament is full (${maxPl()} players).`); break; } if(tm && Object.values(S.players).filter(x=>x.team===tm).length>=teamCap()){ toast(`${teamOf(tm).name} already has ${teamCap()} players.`); break; } const id=newId(); enqueue(()=>db.doc("players/"+id).set({name:nm,team:tm,hi,captain:false,order:Object.keys(S.players).length+1})); logAct(`Admin added ${nm}${tm?" to "+teamOf(tm).name:""}`); toast(`${nm} added.`); document.getElementById("apname").value=""; document.getElementById("apix").value=""; break; }
    case "team-add-new": { if(!needDb()) break; const k=el.dataset.team; if(!canAddTo(k)){ toast("Only the captain of this team can add players."); break; } const nm=(document.getElementById("tn"+k)?.value||"").trim(); const hi=num(document.getElementById("ti"+k)?.value); if(!nm){ toast("Type a nickname."); break; } if(Object.values(S.players).some(x=>(x.name||"").toLowerCase()===nm.toLowerCase())){ toast("That nickname is already in the list."); break; } if(fieldFull()){ toast(`The tournament is full (${maxPl()} players).`); break; } if(Object.values(S.players).filter(x=>x.team===k).length>=teamCap()){ toast(`${teamOf(k).name} already has ${teamCap()} players.`); break; } const id=newId(); enqueue(()=>db.doc("players/"+id).set({name:nm,team:k,hi,captain:false,order:Object.keys(S.players).length+1})); logAct(`${isAdmin?"Admin":editorName()} added ${nm} to ${teamOf(k).name}`); toast(`${nm} added.`); break; }
    case "add-player": addPlayer(el.dataset.team); break;

function deepMerge(a,b){ if(a&&b&&typeof a==="object"&&typeof b==="object"&&!Array.isArray(a)&&!Array.isArray(b)){ const r={...a}; for(const k of Object.keys(b)) r[k]= (k in r)? deepMerge(r[k],b[k]) : b[k]; return r; } return b; }
function rebuild(){
  S.config = ROWS["tournament/config"] || null;
  S.courses = ROWS["tournament/courses"] || clone(COURSES_DEFAULT);
  S.sgcfg = ROWS["sidegames/config"] || null;
  S.players={}; S.sessions={}; S.matches={}; S.cards={}; S.sidegames={}; S.ledger={}; S.log={};
  for(const [k,v] of Object.entries(ROWS)){ const i=k.indexOf("/"), c=k.slice(0,i), id=k.slice(i+1);
    if(c==="players") S.players[id]={id,...v}; else if(c==="sessions") S.sessions[id]={id,...v}; else if(c==="matches"){ if(v&&v.kind==="stroke") S.cards[id]={id,...v}; else S.matches[id]={id,...v}; }
    else if(c==="sidegames"&&id!=="config") S.sidegames[id]={id,...v}; else if(c==="ledger") S.ledger[id]={id,...v}; else if(c==="log") S.log[id]={id,...v}; }
  if(S.config){ document.documentElement.style.setProperty("--a", S.config.teamA?.color||"#3D86FF"); document.documentElement.style.setProperty("--b", S.config.teamB?.color||"#FF5252"); }
  scheduleRender();
}
function applyRaw(op,coll,id,data){ const k=coll+"/"+id;
  if(op==="delete") delete ROWS[k]; else if(op==="set") ROWS[k]=clone(data||{}); else ROWS[k]=deepMerge(ROWS[k]||{}, clone(data||{})); }
function applyLocal(op,coll,id,data){ applyRaw(op,coll,id,data); rebuild(); }
/* Last scores received, so the app opens with data even without signal. */
const CACHEKEY="cupCache";
function loadCache(){ try{ const c=JSON.parse(lsGet(CACHEKEY)||"null"); if(!c||typeof c!=="object") return false; ROWS=c; for(const it of OUTBOX) applyRaw(it.op,it.coll,it.id,it.data); S.loaded=true; S.fromCache=true; rebuild(); return true; }catch(e){ return false; } }
let backend=null;
async function remoteWrite(op,coll,id,data,pin){
  let delay=1200;
  for(;;){
    let res; try{ res = await backend.write(pin||PIN,op,coll,id,data||{}); }catch(e){ res={error:{message:String(e),code:""}}; }
    const err=res.error; if(!err){ if(SYNC.offline){ SYNC.offline=false; SYNC.justSynced=true; setTimeout(()=>{SYNC.justSynced=false; scheduleRender();},4000); } return; }
    if(err.code==="28000"||/bad pin/i.test(err.message||"")){ const e=new Error("Wrong PIN"); e.code="bad_pin"; throw e; }
    if(err.code){ throw new Error(err.message||"Database error"); }
    SYNC.offline=true; scheduleRender();
    await new Promise(r=>setTimeout(r,delay)); delay=Math.min(delay*1.6,10000);
  }
}
let chain=Promise.resolve();
/* Outbox: every change is kept on this phone until the database confirms it, so nothing is lost if the app is closed while offline. */
const OUTKEY="cupOutbox";
let OUTBOX=(()=>{ try{ const v=JSON.parse(lsGet(OUTKEY)||"[]"); return Array.isArray(v)?v:[]; }catch(e){ return []; } })();
const saveOutbox=()=>lsSet(OUTKEY, OUTBOX.length?JSON.stringify(OUTBOX):null);
function sendItem(it){
  SYNC.pending++; scheduleRender();
  const p=chain.then(()=>remoteWrite(it.op,it.coll,it.id,it.data,it.pin)).catch(err=>{
    // The database refused the change: put the screen back to what is really saved and keep a visible note with a retry.
    SYNC.failed={op:it.op,coll:it.coll,id:it.id,data:it.data,msg:err?.message||String(err),code:err?.code||""}; dirty=true; if(err) err.handled=true; throw err; });
  chain=p.catch(()=>{});
  return p.finally(()=>{ OUTBOX=OUTBOX.filter(x=>x.n!==it.n); saveOutbox(); SYNC.pending--; if(SYNC.pending===0 && (dirty||!canWrite)){ dirty=false; loadAll(); } scheduleRender(); });
}
function write(op,coll,id,data){
  applyLocal(op,coll,id,data);
  const it={n:Date.now().toString(36)+Math.random().toString(36).slice(2,6),op,coll,id,data:data||{},pin:PIN};
  OUTBOX.push(it); saveOutbox();
  return sendItem(it);
}
function retryFailed(){ const f=SYNC.failed; SYNC.failed=null; if(!f){ scheduleRender(); return; } if(!canWrite){ showPin(); SYNC.failed=f; return; } write(f.op,f.coll,f.id,f.data).catch(()=>{}); scheduleRender(); }
function replayOutbox(){ for(const it of [...OUTBOX]) sendItem(it).catch(e=>console.warn("Dropped a change:",e?.message||e)); }
function makeDb(){ return { doc(path){ const i=path.indexOf("/"), c=path.slice(0,i), id=path.slice(i+1);
  return { set:d=>write("set",c,id,d), update:d=>write("update",c,id,d), delete:()=>write("delete",c,id) }; } }; }
async function loadAll(){
  if(!backend) return;
  const {data,error}=await backend.load();
  if(error){ if(!S.loaded && loadCache()){ SYNC.offline=true; scheduleRender(); return; } if(!S.loaded){ S.loaded=true; S.fatal=`Could not read the database (${esc(error.message)}). Check config.js and that supabase.sql has been run.`; scheduleRender(); } else { SYNC.offline=true; scheduleRender(); } return; }
  SYNC.offline=false;
  if(SYNC.pending>0 && S.loaded && !S.fromCache){ dirty=true; return; }
  ROWS={}; for(const r of data) ROWS[r.coll+"/"+r.id]=r.data;
  lsSet(CACHEKEY, JSON.stringify(ROWS));
  for(const it of OUTBOX) applyRaw(it.op,it.coll,it.id,it.data);
  S.loaded=true; S.fromCache=false; S.fatal=null; rebuild();
}

/* Supabase backend */
function supabaseBackend(sb){
  return {
    checkRole: async pin => { let r=await sb.rpc("check_role",{p_pin:pin}); if(r.error && !r.error.code && /fetch|network|load failed/i.test(r.error.message||"")) throw new Error("offline"); if(!r.error && (r.data==="admin"||r.data==="scorer")) return r.data; if(r.error){ r=await sb.rpc("check_pin",{p_pin:pin}); return !r.error && r.data===true ? "scorer" : null; } return null; },
    setPin: async (admin,np) => { const {error}=await sb.rpc("set_pin",{p_admin:admin,p_new:np}); return error?error.message:null; },
    write: (pin,op,coll,id,data) => sb.rpc("write_doc",{p_pin:pin,p_op:op,p_coll:coll,p_id:id,p_data:data}),
    load: () => sb.from("kv").select("coll,id,data"),
    subscribe: () => { sb.channel("kv-live").on("postgres_changes",{event:"*",schema:"public",table:"kv"}, payload=>{
        if(SYNC.pending>0){ dirty=true; return; }
        const r=payload.new&&payload.new.coll?payload.new:payload.old; if(!r||!r.coll) return;
        const k=r.coll+"/"+r.id; if(payload.eventType==="DELETE") delete ROWS[k]; else ROWS[k]=payload.new.data; rebuild();
      }).subscribe(status=>{ if(status==="SUBSCRIBED") loadAll(); }); }
  };
}
/* Demo backend: same contract, stored in this browser. PIN 5555. */
const scorerPin = () => lsGet("narieDemoPin")||"5555";
function demoBackend(){
  const KEY="narieDemo"; let store=null;
  const read=()=>{ if(store) return store; try{ store=JSON.parse(lsGet(KEY)||"null"); }catch(e){ store=null; } if(!store){ store=window.DEMO_SEED?clone(window.DEMO_SEED):{}; save(); } return store; };
  const save=()=>lsSet(KEY, JSON.stringify(store));
  const bc = ("BroadcastChannel" in window) ? new BroadcastChannel("narieDemo") : null;
  return {
    checkRole: async pin => pin==="1919"?"admin":pin===scorerPin()?"scorer":null,
    setPin: async (admin,np) => { if(admin!=="1919") return "not allowed"; lsSet("narieDemoPin",np); return null; },
    write: async (pin,op,coll,id,data) => { if(pin!==scorerPin()&&pin!=="1919") return {error:{code:"28000",message:"bad pin"}}; if(!["tournament","players","sessions","matches","sidegames","ledger","log"].includes(coll)) return {error:{code:"22023",message:"bad collection"}};
      if(op==="delete" && pin!=="1919" && ["ledger","sessions","log"].includes(coll)) return {error:{code:"42501",message:"not allowed"}};
      if(pin!=="1919" && read()["tournament/config"]?.closed) return {error:{code:"42501",message:"cup closed"}};
      const st=read(); const k=coll+"/"+id; if(op==="delete") delete st[k]; else if(op==="set") st[k]=clone(data); else st[k]=deepMerge(st[k]||{}, clone(data)); save(); bc&&bc.postMessage("changed"); return {error:null}; },
    load: async () => ({data:Object.entries(read()).map(([k,v])=>{ const i=k.indexOf("/"); return {coll:k.slice(0,i), id:k.slice(i+1), data:v}; }), error:null}),
    subscribe: () => { if(bc) bc.onmessage=()=>{ store=null; if(SYNC.pending===0) loadAll(); else dirty=true; }; window.addEventListener("storage", e=>{ if(e.key===KEY){ store=null; if(SYNC.pending===0) loadAll(); } }); }
  };
}

  if(S.config?.namesLocked&&!isAdmin){ err.textContent="Admin has locked nickname changes."; return; }
  if(!canWrite){ err.textContent="The PIN is needed first."; return; }
  if(S.config?.closed&&!isAdmin){ err.textContent="The Cup is closed."; return; }
  if(!nick){ err.textContent="Type a nickname."; return; }
  if(nick===p.name){ hideModal(); return; }
  if(Object.values(S.players).some(x=>x.id!==id&&(x.name||"").toLowerCase()===nick.toLowerCase())){ err.textContent="That nickname is already taken."; return; }
  hideModal(); logAct(`${p.name} changed their nickname to ${nick}`);
  enqueue(()=>db.doc("players/"+id).update({name:nick})); toast("Saved.");
});
function hideModal(){ const m=document.getElementById("modal"); m.hidden=true; m.innerHTML=""; }
async function tryPin(pin,boot){ if(!backend) return false; let role=null; try{ role=await backend.checkRole(pin); }catch(e){ if(boot){ role=lsGet("cupRole")||"scorer"; } } if(!role) return false; setUnlocked(true,pin,role); return role; }
document.addEventListener("submit", async e=>{
  if(e.target.id!=="pinform") return; e.preventDefault();
  const v=document.getElementById("pinin").value.trim(); const err=document.getElementById("pinerr");
  if(!v){ err.textContent="Enter the PIN."; return; }
  err.textContent="Checking…";
  const ok=await tryPin(v);
  if(ok){ hideModal(); toast(ok==="admin"?"Admin mode on. Scoring unlocked on this device.":"Scoring unlocked on this device."); } else err.textContent="That PIN is not right.";
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !document.getElementById("modal").hidden) hideModal(); });

/* ===== boot ===== */
async function boot(){
  render(); i18nStart();
  if(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY){
    if(!window.supabase){ S.loaded=true; S.fatal="Could not load the Supabase library. Check your internet connection and reload."; render(); return; }
    // Forgive common paste mistakes: spaces, a trailing slash, or the /rest/v1/ ending copied from the Data API page.
    const sbUrl = String(CFG.SUPABASE_URL).trim().replace(/\/+$/,"").replace(/\/rest\/v1$/i,"").replace(/\/+$/,"");
    const sb = window.supabase.createClient(sbUrl, String(CFG.SUPABASE_ANON_KEY).trim(), {auth:{persistSession:false, autoRefreshToken:false}});
    backend = supabaseBackend(sb);
  } else { backend = demoBackend(); S.demo = true; }
  db = makeDb();
  loadCache(); if(S.loaded) render();
  const saved=lsGet("cupPin"); if(saved) await tryPin(saved,true);
  await loadAll();
  replayOutbox();
  backend.subscribe();
  setInterval(()=>{ if(SYNC.pending===0) loadAll(); }, 15000);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && SYNC.pending===0) loadAll(); });
  window.addEventListener("online", ()=>{ if(SYNC.pending===0) loadAll(); });
  window.addEventListener("offline", ()=>{ SYNC.offline=true; scheduleRender(); });
}
boot();

</script>
